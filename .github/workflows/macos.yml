name: macos

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.release.outputs.needed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: release
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx TrorPad-macos.zip; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  macos:
    needs: check
    if: needs.check.outputs.needed == 'true'
    timeout-minutes: 90
    runs-on: macos-15-intel
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: packaging/macos.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 14
          name: trorpad-macos-universal
          path: TrorPad-macos.zip
      - run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          gh release upload "v$VERSION" TrorPad-macos.zip --clobber || { echo "Выпуска v$VERSION ещё нет"; exit 0; }
          gh release download "v$VERSION" -p SHA256SUMS --clobber
          grep -v ' TrorPad-macos.zip$' SHA256SUMS > SHA256SUMS.new || true
          shasum -a 256 TrorPad-macos.zip >> SHA256SUMS.new
          mv SHA256SUMS.new SHA256SUMS
          gh release upload "v$VERSION" SHA256SUMS --clobber
