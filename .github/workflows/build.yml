name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: tror-linux-x86_64
            path: tror-linux-x86_64.tar.gz
          - os: windows-latest
            artifact: tror-windows-x86_64
            path: target/release/tror.exe
          - os: macos-15-intel
            artifact: tror-macos-universal
            path: Tror-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - if: runner.os != 'macOS'
        run: cargo build --release --locked
      - if: runner.os == 'Linux'
        run: tar -czf tror-linux-x86_64.tar.gz -C target/release tror
      - if: runner.os == 'macOS'
        run: packaging/macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
