name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: trorpad-linux-x86_64
          - os: windows-latest
            artifact: trorpad-windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      HAS_CERT: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked
      - if: runner.os == 'Linux'
        name: Interface tests
        run: cargo test --locked ui_ -- --ignored --test-threads=1
      - if: runner.os == 'Linux'
        name: Live server tests
        run: |
          sudo apt-get install -y -qq openssh-server python3-pyftpdlib > /dev/null
          sudo useradd -m -s /bin/bash jozef
          echo 'jozef:secret' | sudo chpasswd
          sudo mkdir -p /home/jozef/www/css /run/sshd
          echo '<?php echo 1;' | sudo tee /home/jozef/www/index.php > /dev/null
          sudo chown -R jozef:jozef /home/jozef/www
          sudo /usr/sbin/sshd -p 2222 -o PasswordAuthentication=yes -o KbdInteractiveAuthentication=yes
          mkdir -p /tmp/ftproot/www/css && echo '<?php echo 1;' > /tmp/ftproot/www/index.php && chmod -R 777 /tmp/ftproot
          python3 .github/ci/ftpd.py > /tmp/ftpd.log 2>&1 &
          sleep 2
          cargo test --locked live_sftp -- --ignored --test-threads=1
          cargo test --locked live_ftp_server -- --ignored --test-threads=1
      - run: cargo build --release --locked
      - if: runner.os == 'Linux'
        name: Speed check
        run: |
          set -o pipefail
          target/release/trorpad --bench | tee -a "$GITHUB_STEP_SUMMARY"
      - if: runner.os == 'Linux'
        run: tar -czf trorpad-linux-x86_64.tar.gz -C target/release trorpad
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 14
          name: ${{ matrix.artifact }}
          path: trorpad-linux-x86_64.tar.gz
      - if: runner.os == 'Windows' && env.HAS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $tool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          "SIGNTOOL=$($tool.FullName)" >> $env:GITHUB_ENV
          & $tool.FullName sign /f "$env:RUNNER_TEMP\sign.pfx" /p "$env:WINDOWS_PFX_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target\release\trorpad.exe
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TROR_VERSION = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc packaging\tror.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target\release\trorpad.exe trorpad.exe
      - if: runner.os == 'Windows' && env.HAS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\sign.pfx" /p "$env:WINDOWS_PFX_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 trorpad-setup.exe
          Remove-Item "$env:RUNNER_TEMP\sign.pfx"
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 14
          name: ${{ matrix.artifact }}
          path: |
            trorpad.exe
            trorpad-setup.exe

  plugin:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: sdk
      - run: cargo test --locked --manifest-path sdk/Cargo.toml
      - run: cargo build --locked --release --manifest-path sdk/Cargo.toml --target wasm32-unknown-unknown -p text-tools
      - run: |
          mkdir -p pack/text-tools
          cp sdk/target/wasm32-unknown-unknown/release/text_tools.wasm pack/text-tools/plugin.wasm
          cp sdk/examples/text-tools/plugin.json pack/text-tools/
          (cd pack && zip -r ../trorpad-plugin-text-tools.zip text-tools)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 14
          name: trorpad-plugin-text-tools
          path: trorpad-plugin-text-tools.zip

  release:
    timeout-minutes: 10
    needs: [build, plugin]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
      - run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Выпуск v$VERSION уже есть"
            exit 0
          fi
          if [ ! -f dist/trorpad-windows-x86_64/trorpad.exe ]; then
            echo "Нет сборки Windows — выпуск не создаётся"
            exit 0
          fi
          mkdir out
          cp dist/trorpad-windows-x86_64/trorpad.exe dist/trorpad-windows-x86_64/trorpad-setup.exe out/
          cp out/trorpad.exe out/tror.exe
          cp out/trorpad-setup.exe out/tror-setup.exe
          if [ -f dist/trorpad-linux-x86_64/trorpad-linux-x86_64.tar.gz ]; then
            tar -xzf dist/trorpad-linux-x86_64/trorpad-linux-x86_64.tar.gz -C out
            mv out/trorpad out/trorpad-linux-x86_64
            cp out/trorpad-linux-x86_64 out/tror-linux-x86_64
          fi
          if [ -f dist/trorpad-plugin-text-tools/trorpad-plugin-text-tools.zip ]; then
            cp dist/trorpad-plugin-text-tools/trorpad-plugin-text-tools.zip out/
          fi
          (cd out && sha256sum * > SHA256SUMS)
          git log -1 --pretty=%B > notes.txt
          gh release create "v$VERSION" out/* --title "TrorPad $VERSION" --notes-file notes.txt --target "$GITHUB_SHA"
          python3 packaging/packages.py release "$VERSION" out/SHA256SUMS "$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket Formula packaging/winget
          if ! git diff --cached --quiet; then
            git commit -m "Scoop, Homebrew and winget manifests for $VERSION"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 10
            done
          fi
