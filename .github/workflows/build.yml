name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: trorpad-linux-x86_64
          - os: windows-latest
            artifact: trorpad-windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      HAS_CERT: ${{ secrets.WINDOWS_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked
      - run: cargo build --release --locked
      - if: runner.os == 'Linux'
        run: tar -czf trorpad-linux-x86_64.tar.gz -C target/release trorpad
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 14
          name: ${{ matrix.artifact }}
          path: trorpad-linux-x86_64.tar.gz
      - if: runner.os == 'Windows' && env.HAS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $tool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          "SIGNTOOL=$($tool.FullName)" >> $env:GITHUB_ENV
          & $tool.FullName sign /f "$env:RUNNER_TEMP\sign.pfx" /p "$env:WINDOWS_PFX_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target\release\trorpad.exe
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TROR_VERSION = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc packaging\tror.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target\release\trorpad.exe trorpad.exe
      - if: runner.os == 'Windows' && env.HAS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f "$env:RUNNER_TEMP\sign.pfx" /p "$env:WINDOWS_PFX_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 trorpad-setup.exe
          Remove-Item "$env:RUNNER_TEMP\sign.pfx"
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 14
          name: ${{ matrix.artifact }}
          path: |
            trorpad.exe
            trorpad-setup.exe

  plugin:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: sdk
      - run: cargo test --locked --manifest-path sdk/Cargo.toml
      - run: cargo build --locked --release --manifest-path sdk/Cargo.toml --target wasm32-unknown-unknown -p text-tools
      - run: |
          mkdir -p pack/text-tools
          cp sdk/target/wasm32-unknown-unknown/release/text_tools.wasm pack/text-tools/plugin.wasm
          cp sdk/examples/text-tools/plugin.json pack/text-tools/
          (cd pack && zip -r ../trorpad-plugin-text-tools.zip text-tools)
          base64 -w0 trorpad-plugin-text-tools.zip; echo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 14
          name: trorpad-plugin-text-tools
          path: trorpad-plugin-text-tools.zip

  release:
    timeout-minutes: 10
    needs: [build, plugin]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
      - run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Выпуск v$VERSION уже есть"
            exit 0
          fi
          if [ ! -f dist/trorpad-windows-x86_64/trorpad.exe ]; then
            echo "Нет сборки Windows — выпуск не создаётся"
            exit 0
          fi
          mkdir out
          cp dist/trorpad-windows-x86_64/trorpad.exe dist/trorpad-windows-x86_64/trorpad-setup.exe out/
          cp out/trorpad.exe out/tror.exe
          cp out/trorpad-setup.exe out/tror-setup.exe
          if [ -f dist/trorpad-linux-x86_64/trorpad-linux-x86_64.tar.gz ]; then
            tar -xzf dist/trorpad-linux-x86_64/trorpad-linux-x86_64.tar.gz -C out
            mv out/trorpad out/trorpad-linux-x86_64
            cp out/trorpad-linux-x86_64 out/tror-linux-x86_64
          fi
          if [ -f dist/trorpad-plugin-text-tools/trorpad-plugin-text-tools.zip ]; then
            cp dist/trorpad-plugin-text-tools/trorpad-plugin-text-tools.zip out/
          fi
          (cd out && sha256sum * > SHA256SUMS)
          git log -1 --pretty=%B > notes.txt
          gh release create "v$VERSION" out/* --title "TrorPad $VERSION" --notes-file notes.txt --target "$GITHUB_SHA"

  macos:
    timeout-minutes: 60
    runs-on: macos-15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked
      - run: packaging/macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          retention-days: 14
          name: trorpad-macos-universal
          path: TrorPad-macos.zip
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          gh release upload "v$VERSION" TrorPad-macos.zip --clobber || echo "Выпуска v$VERSION ещё нет"
