name: architecture

on:
  push:
    branches: [main]
    paths: ["src/**", "sdk/**", "Cargo.toml", "Cargo.lock", ".deslop-please.allow", ".github/workflows/architecture.yml"]
  pull_request:
    paths: ["src/**", "sdk/**", "Cargo.toml", "Cargo.lock", ".deslop-please.allow"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deslop:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.97.0
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/lint-tools
          key: lint-tools-ra-2026-08-10-deslop-0.1.4-rust-1.97.0
      - name: Install lint tools
        run: |
          if [ ! -x ~/lint-tools/bin/deslop-please ]; then
            cargo install --locked --root ~/lint-tools deslop-please@0.1.4
            cargo install --locked --root ~/lint-tools --git https://github.com/rust-lang/rust-analyzer --tag 2026-08-10 rust-analyzer
          fi
          echo "$HOME/lint-tools/bin" >> "$GITHUB_PATH"
      - name: Architecture lints
        run: |
          set -o pipefail
          if [ -f .deslop-please.allow ]; then
            deslop-please --allow .deslop-please.allow 2>&1 | tee deslop.txt
          else
            deslop-please 2>&1 | tee deslop.txt || true
            deslop-please --update-allow deslop-allow.txt > /dev/null 2>&1 || true
            echo "----- allow list -----"
            cat deslop-allow.txt || true
            echo "----- end -----"
          fi
      - if: always()
        run: |
          {
            echo '### deslop-please'
            echo '```'
            grep -E '^(error|warning)' deslop.txt | sed -E 's/:.*//' | sort | uniq -c | sort -rn || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deslop-report
          retention-days: 14
          path: |
            deslop.txt
            deslop-allow.txt
          if-no-files-found: ignore
