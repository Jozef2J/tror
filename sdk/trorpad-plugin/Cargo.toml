[package]
name = "trorpad-plugin"
version = "1.1.1"
edition = "2024"
description = "Rust SDK for TrorPad editor plugins (WebAssembly, wasm32-unknown-unknown)"
repository = "https://github.com/Jozef2J/tror"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Jozef2J/tror/tree/main/sdk"
documentation = "https://github.com/Jozef2J/tror/blob/main/sdk/README.md"
readme = "../README.md"
keywords = ["trorpad", "plugin", "editor", "wasm", "sdk"]
categories = ["wasm", "text-editors", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
